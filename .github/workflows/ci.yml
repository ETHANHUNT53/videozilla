# F0.5 — every push and pull request: install from the lockfile, then typecheck, lint and unit tests.
# No secrets are needed: tests mock Gemini / ElevenLabs and run MongoDB in memory.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # mongodb-memory-server downloads a MongoDB binary (~100 MB) for the database tests; keep it between runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
