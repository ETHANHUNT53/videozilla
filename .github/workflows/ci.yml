# F0.5 — install from the lockfile, then typecheck, lint, unit tests and a production build of the web app.
# No secrets are needed: tests mock Gemini / ElevenLabs and run MongoDB in memory.
name: CI

on:
  # Pushes to the long-lived branches; any other branch is checked through its pull request (one run per commit, not two).
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    # Pinned (not ubuntu-latest) so an OS upgrade can't break the in-memory MongoDB used by the tests without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # mongodb-memory-server downloads a MongoDB binary (~100 MB) for the database tests; keep it between runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved); the comment is the release it points to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Keyed on the mongodb-memory-server version (which decides the MongoDB binary), not the whole lockfile.
      - name: Cache MongoDB binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('node_modules/mongodb-memory-server-core/package.json') }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=.cache/vitest.json

      # Catches what the checks above can't: route-segment exports, server/client boundaries, prerendering.
      # Server settings are read lazily, so only Better Auth's secret needs a (throwaway, non-secret) value here.
      - name: Build web app
        run: npm run build -w @videozilla/web
        env:
          BETTER_AUTH_SECRET: ci-build-only-placeholder-not-a-real-secret-0123456789

      # Step logs need a GitHub sign-in; this puts the test counts on the public run page as well.
      - name: Test summary
        if: always() && hashFiles('.cache/vitest.json') != ''
        run: |
          node -e '
            const r = require("./.cache/vitest.json");
            const line = `${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} skipped (${r.testResults.length} files)`;
            console.log(`::notice title=Unit tests::${line}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Unit tests\n${line}\n`);
          '
